          test -s build/libmain60.so
          # Stage 1 artifact preserves build/${PRESET}/ relative paths for DXVK, SDL, OpenAL and hooks.
          for lib in libdxvk_d3d8.so libdxvk_d3d9.so libgamespy.so; do
            test -s "$PRESET_DIR/$lib" || { echo "::error::Missing runtime dependency: $PRESET_DIR/$lib"; exit 1; }
          done
      - name: Verify artifacts
        run: |
          set -euo pipefail
          READELF="$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)"
          # GeneralsX @bugfix Android port 13/07/2026 - this step has
          # intermittently failed "libmain.so is not AArch64" (builds #118,
          # #127, #129) within milliseconds of ninja's own "Linking ...
          # libmain.so" line, always on an otherwise-clean build (re-running
          # the identical commit always passes). The broad `find ... -name
          # libmain.so | head -1` this used to run has no ordering guarantee
          # when the build dir accumulates more than one match across cached/
          # incremental runs (ccache + vcpkg + DXVK build caches are all
          # restored between runs) -- `head -1` can silently grab a stale or
          # wrong-arch copy instead of the one ninja just linked. The target's
          # own OUTPUT_NAME (GeneralsMD/Code/Main/CMakeLists.txt) makes the
          # real path deterministic, so use it directly instead of searching.
          GAME_LIB="build/${{ env.PRESET }}/GeneralsMD/Code/Main/libmain.so"
          if [ ! -f "$GAME_LIB" ]; then echo "::error::libmain.so not found at $GAME_LIB"; exit 1; fi
          # GeneralsX @bugfix Android port 31/07/2026 - the deterministic
          # OUTPUT_NAME path above (13/07/2026 fix) stopped `head -1` from
          # grabbing the wrong file, but the readelf check itself still
          # failed twice in a row on two otherwise-clean reruns of the exact
          # same commit (both with warm ccache/vcpkg/DXVK caches, both
          # failing within ~25ms of this step starting) -- pointing at an
          # I/O visibility race on the runner rather than a real wrong-arch
          # binary: the prior step already exited 0, so the linker's writes
          # should be complete, but the file's content isn't always visible
          # to a process started microseconds later. Retry a few times with
          # a short sleep before failing for real; a genuinely wrong-arch
          # binary will still fail every attempt and correctly error out.
          READELF_OK=0
          for attempt in 1 2 3 4 5; do
            if "$READELF" -h "$GAME_LIB" 2>/dev/null | grep -q AArch64; then
              READELF_OK=1
              break
            fi
            sleep 1
          done
          [ "$READELF_OK" = "1" ] || { echo "::error::libmain.so is not AArch64"; exit 1; }
          for lib in libdxvk_d3d8.so libdxvk_d3d9.so; do
            [ -f "build/${{ env.PRESET }}/$lib" ] || { echo "::error::$lib missing"; exit 1; }
          done
          strings "build/${{ env.PRESET }}/libdxvk_d3d9.so" | grep -q Sdl3WsiDriver || {
            echo "::error::libdxvk_d3d9.so built without the SDL3 WSI (silent fallback)"; exit 1; }
          echo "Artifacts verified: AArch64 libmain.so + DXVK with SDL3 WSI"

      # GeneralsX @bugfix Android CI 15/10/2026 "a build succeeded" is not evidence that all
      # four engines exist, and a missing one only shows up on a device as "Generals does
      # nothing" or "60 Hz quietly fell back to 30 Hz". Check the files themselves -- and check
      # WHICH engine each one is, which a file-existence test cannot tell you. The engine bakes
      # in its GeneralsOnline client id (NextGenMP_defines.h: gen_online_60hz when
      # SAGE_HIGH_FPS_SIM is ON, gen_online_30hz when it is OFF), so the string is in the binary
      # and distinguishes the two passes; neither string exists anywhere in the base game's tree,
      # which is what separates libgenerals.so from a mislabelled Zero Hour build.
      - name: Verify all four engines (ELF AArch64 + 30/60 Hz identity)
        run: |
          set -euo pipefail
          READELF="$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)"
          MAIN="build/${{ env.PRESET }}/GeneralsMD/Code/Main/libmain.so"
          MAIN60="build/libmain60.so"
          GENERALS="build/${{ env.PRESET }}/Generals/Code/Main/libgenerals.so"
          GENERALS60="build/libgenerals60.so"
          fail=0
          for lib in "${MAIN}" "${MAIN60}" "${GENERALS}" "${GENERALS60}"; do
            if [ ! -f "${lib}" ]; then
              echo "::error::engine ${lib} was not built"
              fail=1
              continue
            fi
            SIZE="$(stat -c %s "${lib}")"
            if [ "${SIZE}" -lt 5000000 ]; then
              echo "::error::engine ${lib} is only ${SIZE} bytes -- that is not a linked engine"
              fail=1
              continue
            fi
            # The same I/O-visibility retry as the "Verify artifacts" step above: a process
            # started microseconds after the linker's last write has read a file whose content
            # was not fully visible yet on the runner. A genuinely wrong-arch file fails all five
            # attempts.
            OK=0
            for attempt in 1 2 3 4 5; do
              if "${READELF}" -h "${lib}" 2>/dev/null | grep -q AArch64; then OK=1; break; fi
              sleep 1
            done
            if [ "${OK}" != "1" ]; then
              echo "::error::${lib} is not an AArch64 ELF"
              fail=1
            fi
          done
          [ "${fail}" -eq 0 ] || exit 1

          # `strings` output is captured first, then matched: piping it straight into `grep -q`
          # lets grep close the pipe on its first match and SIGPIPE `strings` mid-write, which
          # pipefail reports as a failure of a perfectly good check (same trap as
          # build-android-zh.sh's readelf|grep).
          MAIN_STRINGS="$(strings "${MAIN}")"
          MAIN60_STRINGS="$(strings "${MAIN60}")"
          GENERALS_STRINGS="$(strings "${GENERALS}")"
          if ! grep -qF -- "gen_online_30hz" <<< "${MAIN_STRINGS}"; then
            echo "::error::libmain.so is not the 30 Hz engine (no gen_online_30hz in it)"
            fail=1
          fi
          if grep -qF -- "gen_online_60hz" <<< "${MAIN_STRINGS}"; then
            echo "::error::libmain.so is a 60 Hz build -- the 30 Hz pass must be the last one"
            fail=1
          fi
          if ! grep -qF -- "gen_online_60hz" <<< "${MAIN60_STRINGS}"; then
            echo "::error::libmain60.so is not the 60 Hz engine (no gen_online_60hz in it)"
            fail=1
          fi
          if grep -qF -- "gen_online_30hz" <<< "${MAIN60_STRINGS}"; then
            echo "::error::libmain60.so is a 30 Hz build -- pass 1 did not reconfigure with -DSAGE_HIGH_FPS_SIM=ON"
            fail=1
          fi
          if grep -qF -- "gen_online_" <<< "${GENERALS_STRINGS}"; then
            echo "::error::libgenerals.so carries a Zero Hour GeneralsOnline client id -- it is not the base game's engine"
            fail=1
          fi
          SHA_MAIN="$(sha256sum "${MAIN}" | cut -d' ' -f1)"
          SHA_MAIN60="$(sha256sum "${MAIN60}" | cut -d' ' -f1)"
          SHA_GENERALS="$(sha256sum "${GENERALS}" | cut -d' ' -f1)"
          SHA_GENERALS60="$(sha256sum "${GENERALS60}" | cut -d' ' -f1)"
          if [ "${SHA_MAIN}" = "${SHA_MAIN60}" ]; then
            echo "::error::libmain.so and libmain60.so are byte-identical -- the 60 Hz pass did not produce a new engine"
            fail=1
          fi
          if [ "${SHA_MAIN}" = "${SHA_GENERALS}" ]; then
            echo "::error::libmain.so and libgenerals.so are byte-identical -- the base game's engine was not built"
            fail=1
          fi
          if [ "${SHA_GENERALS}" = "${SHA_GENERALS60}" ]; then
            echo "::error::libgenerals.so and libgenerals60.so are byte-identical -- the Generals 60 Hz build was not produced"
            fail=1
          fi
          [ "${fail}" -eq 0 ] || exit 1
          echo "Engines verified: libmain.so (Zero Hour 30 Hz), libmain60.so (Zero Hour 60 Hz), libgenerals.so (Generals 30 Hz), libgenerals60.so (Generals 60 Hz)"
          echo "  sha256 libmain.so       ${SHA_MAIN}"
          echo "  sha256 libmain60.so     ${SHA_MAIN60}"
          echo "  sha256 libgenerals.so   ${SHA_GENERALS}"
          echo "  sha256 libgenerals60.so ${SHA_GENERALS60}"

      # GeneralsX @feature Android CI 06/09/2026 The strip step below is what
      # keeps the APK at ~42MB instead of ~118MB, but it also destroys the one
      # thing that made real device tombstones readable: several fixes in this
      # port were found by resolving crash addresses against that exact build's
      # unstripped libmain.so, and nothing in the pipeline kept a copy, so a
      # released build's crash log can no longer be symbolized at all.
      # Uploading the unstripped library is not an option -- it is ~282MB on
      # its own and this repo's entire Actions storage quota is 0.5GB (see the
      # retention comment on the APK upload below). A text symbol table costs a
      # few MB instead, and address -> function+offset is what those
      # investigations actually used. The program headers travel with it so the
      # vaddr-vs-file-offset bias (the +0x1000 one, rediscovered by hand more
      # than once) is written down next to the symbols it applies to.
      - name: Collect symbol table (before stripping)
        run: |
          set -e
          TOOLS="$(dirname "$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-nm | head -1)")"
          LIB="build/${{ env.PRESET }}/GeneralsMD/Code/Main/libmain.so"
          mkdir -p symbols
          OUT="symbols/libmain-run${{ github.run_number }}.symbols.txt"
          BUILD_ID="$(readelf -n "$LIB" 2>/dev/null | sed -n 's/.*Build ID: \([0-9a-f]*\).*/\1/p' | head -1)"
          {
            echo "# libmain.so symbols -- run ${{ github.run_number }}, commit ${{ github.sha }}"
            echo "# Match this BuildID against the tombstone's before trusting any address."
            # llvm-readelf --notes prints the note's header but not the build-id
            # value itself, so pull it out with GNU readelf, which does.
            echo "# BuildID: ${BUILD_ID:-UNKNOWN}"
            "$TOOLS/llvm-readelf" --notes --program-headers "$LIB"
            echo "# --- defined symbols: address size type name ---"
            "$TOOLS/llvm-nm" --defined-only --numeric-sort --print-size --demangle "$LIB"
          } > "$OUT"
          # A table that came out empty (wrong path, or a library that was
          # already stripped upstream of here) is worse than no table: it
          # would ship attached to a Release looking authoritative. Say so.
          SYMS=$("$TOOLS/llvm-nm" --defined-only "$LIB" 2>/dev/null | wc -l)
          echo "Symbols captured: ${SYMS}"
          if [ "${SYMS}" -lt 1000 ]; then
            echo "::warning::libmain.so yielded only ${SYMS} symbols -- crash logs from this build will not symbolize."
          fi
          gzip -9 "$OUT"
          ls -la symbols/

      # GeneralsX @bugfix Android CI 06/08/2026 CI never stripped debug
      # symbols, so every uploaded artifact/Release asset shipped a fully
      # unstripped libmain.so (282MB on its own) straight into the APK --
      # AGP's own stripReleaseDebugSymbols task fails silently on all of our
      # custom-built libraries for an unrelated reason (see build.gradle),
      # so nothing else in the pipeline ever did this either. The local dev
      # loop (scripts/build/android/build-local-sandboxed.sh) already runs
      # this exact llvm-strip pass and ships a ~48MB APK instead of the
      # ~118MB one CI had been producing (confirmed against the v1.1.5
      # release asset) -- port it here so public builds get the same win.
      # libdxvk_d3d8.so/libdxvk_d3d9.so are deliberately excluded: stripping
      # them crashes DXVK's draw path on real hardware (keepDebugSymbols in
      # android/app/build.gradle has the full story).
      - name: Strip debug symbols
        run: |
          STRIP="$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-strip | head -1)"
          # GeneralsX @bugfix Android CI 15/10/2026 The other two engines are stripped here too:
          # each is another ~40 MB of unstripped engine in an APK that carries four of them
          # (build/libmain60.so and build/libgenerals60.so are pass 1's stashed outputs).
          for lib in "build/${{ env.PRESET }}/GeneralsMD/Code/Main/libmain.so" \
                     "build/libmain60.so" \
                     "build/${{ env.PRESET }}/Generals/Code/Main/libgenerals.so" \
                     "build/libgenerals60.so" \
                     "build/${{ env.PRESET }}/_deps/sdl3-build/libSDL3.so" \
                     "build/${{ env.PRESET }}/_deps/sdl3_image-build/libSDL3_image.so" \
                     "build/${{ env.PRESET }}/_deps/openal_soft-build/libopenal.so" \
                     "build/${{ env.PRESET }}/libgamespy.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/libadrenotools.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/src/hook/libgsl_alloc_hook.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/src/hook/libhook_impl.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/src/hook/libmain_hook.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/src/hook/libfile_redirect_hook.so"; do
            [ -f "$lib" ] && "$STRIP" --strip-unneeded "$lib"
          done

      - name: Set artifact version
        id: artifact
        run: |
          # GeneralsX @feature Android port 08/07/2026 Version numbers are
          # manually managed (android/app/build.gradle), not auto-bumped from
          # the workflow run number anymore. A manual "Run workflow" dispatch
          # can still override them for a one-off build via the version_name /
          # version_code inputs above; a normal push build passes neither, so
          # Gradle falls back to whatever is committed in build.gradle.
          echo "version_code=${{ inputs.version_code || '' }}" >> "$GITHUB_OUTPUT"
          echo "version_name=${{ inputs.version_name || '' }}" >> "$GITHUB_OUTPUT"
          echo "apk_name=GeneralsXZH-android-run${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"

      - name: Package APK
        env:
          # scripts/build/android/package-android-zh.sh uses these to stage
          # jniLibs/, the SDL3 Java glue, and fonts, then invokes Gradle. Same
          # fixed debug.keystore every run (committed in android/app/) is what
          # makes consecutive CI builds installable as updates over each other
          # rather than requiring an uninstall, PROVIDED versionCode was bumped
          # by hand (in build.gradle or via a manual-dispatch override) since
          # the last build the user actually installed.
          GX_ANDROID_STAGING: ${{ github.workspace }}/android-staging
          GX_ANDROID_VERSION_CODE: ${{ steps.artifact.outputs.version_code }}
          GX_ANDROID_VERSION_NAME: ${{ steps.artifact.outputs.version_name }}
          # GeneralsX @bugfix Android CI 15/10/2026 The 60 Hz Zero Hour engine set aside by pass 1
          # of the build. Without this the packaging script has no second engine to stage and
          # quietly ships a 30 Hz-only APK; GX_REQUIRE_ALL_ENGINES makes that a hard failure here
          # rather than a device-side surprise (see package-android-zh.sh).
          GX_SECOND_GAME_LIB: ${{ github.workspace }}/build/libmain60.so
          GX_SECOND_BASE_GAME_LIB: ${{ github.workspace }}/build/libgenerals60.so
          GX_REQUIRE_ALL_ENGINES: "1"
        run: |
          ./scripts/build/android/package-android-zh.sh

      - name: Locate APK
        id: locate
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then echo "::error::APK not found at $APK"; exit 1; fi
          cp "$APK" "${{ steps.artifact.outputs.apk_name }}"
          echo "path=${{ steps.artifact.outputs.apk_name }}" >> "$GITHUB_OUTPUT"

      # GeneralsX @bugfix Android CI 07/07/2026 A real device caught what CI
      # missed: run #10's APK was missing libgamespy.so (a genuine DT_NEEDED
      # of libmain.so, not an optional lib) and crashed at dlopen on launch —
      # package-android-zh.sh only warned, and nothing checked the actual APK
      # contents against what libmain.so declares it needs. Do that here:
      # every non-system DT_NEEDED of libmain.so must be a real file inside
      # the APK's lib/arm64-v8a/, or the build is not actually shippable.
      - name: Verify APK carries all four engines and every library they need
        run: |
          set -euo pipefail
          READELF="$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)"
          APK="${{ steps.locate.outputs.path }}"
          WORKDIR="$(mktemp -d)"
          unzip -q "${APK}" 'lib/arm64-v8a/*' -d "${WORKDIR}"
          LIBDIR="${WORKDIR}/lib/arm64-v8a"
          echo "Packaged libraries:"
          ls "${LIBDIR}"
          missing=0
          # GeneralsX @bugfix Android CI 15/10/2026 The engines are not optional extras:
          # SetupActivity.engineLibraries() names libmain*/libgenerals* and
          # GeneralsZHActivity.getLibraries() loads whichever the player selected, so an engine
          # absent from the APK is a launcher option that cannot work on the device. Nothing used
          # to check that any engine other than libmain.so ever reached the APK at all.
          for engine in libmain.so libmain60.so libgenerals.so libgenerals60.so; do
            if [ ! -f "${LIBDIR}/${engine}" ]; then
              echo "::error::engine ${engine} is not packaged in the APK"
              missing=1
              continue
            fi
            echo "${engine}: $(stat -c %s "${LIBDIR}/${engine}") bytes"
          done
          [ "${missing}" -eq 0 ] || { echo "::error::APK is missing an engine the launcher offers."; exit 1; }

          # Which engine each packaged library actually is (see the engine verification step for
          # why the GeneralsOnline client id is the discriminator). A swapped pair -- a 30 Hz build
          # renamed libmain60.so, or a Zero Hour build in the base game's slot -- would otherwise
          # only be discoverable by playing: the first would silently mis-simulate in cross-play,
          # the second would load Zero Hour data out of the base game's folder.
          for pair in "libmain.so:gen_online_30hz" "libmain60.so:gen_online_60hz"; do
            lib="${pair%%:*}"
            id="${pair##*:}"
            STRINGS="$(strings "${LIBDIR}/${lib}")"
            if ! grep -qF -- "${id}" <<< "${STRINGS}"; then
              echo "::error::packaged ${lib} does not carry ${id} -- the engines are swapped or mislabelled"
              missing=1
            fi
          done
          STRINGS_GENERALS="$(strings "${LIBDIR}/libgenerals.so")"
          if grep -qF -- "gen_online_" <<< "${STRINGS_GENERALS}"; then
            echo "::error::packaged libgenerals.so carries a Zero Hour client id -- the base game's slot holds a Zero Hour build"
            missing=1
          fi
          [ "${missing}" -eq 0 ] || exit 1

          # A real device caught what CI missed once before (run #10's APK was missing
          # libgamespy.so, a genuine DT_NEEDED of libmain.so, and crashed at dlopen on launch),
          # so this runs for each engine, not just libmain.so: every non-system DT_NEEDED must be
          # a real file inside the APK's lib/arm64-v8a/, or the build is not shippable.
          for engine in libmain.so libmain60.so libgenerals.so; do
            NEEDED="$("${READELF}" -d "${LIBDIR}/${engine}" | grep NEEDED | sed -E 's/.*\[(.*)\]/\1/')"
            for lib in ${NEEDED}; do
              case "${lib}" in
                libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libGLESv*|libEGL.so|libvulkan.so|libOpenSLES.so|libaaudio.so|libmediandk.so|libcamera2ndk.so|libjnigraphics.so|libnativewindow.so|libsync.so|libz.so)
                  continue ;;  # system libs every device provides via the NDK stable ABI (run
                               # #11 caught libmediandk.so, pulled in by FFmpeg's MediaCodec
                               # backend, missing from this allowlist — see docs/port/ANDROID_PORT.md)
              esac
              if [ ! -f "${LIBDIR}/${lib}" ]; then
                echo "::error::${engine} needs '${lib}' at runtime but it is not packaged in the APK"
                missing=1
              fi
            done
          done
          if cmp -s "${LIBDIR}/libgenerals.so" "${LIBDIR}/libgenerals60.so"; then
            echo "::error::libgenerals.so and libgenerals60.so are byte-identical"
            missing=1
          fi
          # The base-game pair has no Zero Hour client-id marker. Reject an identical pair,
          # which would indicate that the 60 Hz Generals output was not produced correctly.
          if cmp -s "${LIBDIR}/libgenerals.so" "${LIBDIR}/libgenerals60.so"; then
            echo "::error::libgenerals.so and libgenerals60.so are byte-identical"
            missing=1
          fi
          rm -rf "${WORKDIR}"
          if [ "${missing}" -ne 0 ]; then
            echo "::error::APK is missing required native libraries or one of the four engines."
            exit 1
          fi
          echo "OK: all four engines are packaged, and every DT_NEEDED dependency of each is present in the APK."

      # GeneralsX @bugfix Android CI 15/10/2026 The dispatch inputs version_name/version_code
      # reached Gradle before, but nothing read them back out of the finished artifact, so a
      # mismatch (or a dropped -P property) was invisible. Read the APK's own manifest, and check
      # the signature with the SDK's apksigner instead of assuming installability. Note what this
      # does NOT claim: the APK is signed with the repository's committed debug keystore
      # (android/app/debug.keystore -- the reason consecutive CI builds install as updates over
      # each other). No production release key or signing secret exists in this repository, so no
      # build published from here is store-grade signed, and the steps that publish say so.
      - name: Verify APK version and signature
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          APK="${{ steps.locate.outputs.path }}"
          BADGING="$("${BUILD_TOOLS}/aapt2" dump badging "${APK}")"
          APK_NAME="$(sed -nE "s/^package:.*versionName='([^']*)'.*/\1/p" <<< "${BADGING}")"
          APK_CODE="$(sed -nE "s/^package:.*versionCode='([0-9]+)'.*/\1/p" <<< "${BADGING}")"
          echo "APK says:   versionName='${APK_NAME}' versionCode='${APK_CODE}'"
          # Expected value: the manual-dispatch input when given, otherwise the committed default in
          # android/app/build.gradle that Gradle falls back to (versionCode/versionName there are
          # `hasProperty(...) ? override : committed`, so the fallback is the last operand).
          EXPECT_NAME="${{ inputs.version_name }}"
          EXPECT_CODE="${{ inputs.version_code }}"
          if [ -z "${EXPECT_NAME}" ]; then
            EXPECT_NAME="$(sed -nE "s/^ *versionName .*: *'([^']+)'\).*/\1/p" android/app/build.gradle | head -1)"
          fi
          if [ -z "${EXPECT_CODE}" ]; then
            EXPECT_CODE="$(sed -nE 's/^ *versionCode .*: *([0-9]+)\).*/\1/p' android/app/build.gradle | head -1)"
          fi
          echo "Expected:   versionName='${EXPECT_NAME}' versionCode='${EXPECT_CODE}'"
          if [ -z "${APK_CODE}" ] || [ -z "${APK_NAME}" ]; then
            echo "::error::could not read versionCode/versionName out of the APK manifest"
            exit 1
          fi
          if [ -z "${EXPECT_CODE}" ] || [ -z "${EXPECT_NAME}" ]; then
            echo "::error::could not determine the expected version (no dispatch input and no parsable default in android/app/build.gradle)"
            exit 1
          fi
          [ "${APK_CODE}" = "${EXPECT_CODE}" ] || { echo "::error::APK versionCode ${APK_CODE} does not match the expected ${EXPECT_CODE}"; exit 1; }
          [ "${APK_NAME}" = "${EXPECT_NAME}" ] || { echo "::error::APK versionName ${APK_NAME} does not match the expected ${EXPECT_NAME}"; exit 1; }

          SIGNERS="$("${BUILD_TOOLS}/apksigner" verify --print-certs "${APK}" 2>&1)"
          echo "${SIGNERS}"
          if ! grep -q "Signer #1 certificate DN" <<< "${SIGNERS}"; then
            echo "::error::apksigner could not verify the APK signature"
            exit 1
          fi
          # Which key signed this, established by certificate digest rather than by the DN: the
          # committed debug key's DN is "CN=GeneralsX Android Debug", not the "CN=Android Debug"
          # an auto-generated per-machine debug key would carry, so a DN test would silently fail
          # to fire here. Compare the APK's signer digest with the committed keystore's own
          # digest; keytool says SHA256: (uppercase, colon-separated), apksigner says lowercase
          # hex, so both are normalised to lowercase without colons before comparing. `keytool`
          # arrives with the JDK the job already installs. The keystore's password is the
          # well-known debug one (android/app/build.gradle) and is never echoed; only digests
          # are printed.
          APK_CERT_SHA256="$(sed -nE 's/^Signer #1 certificate SHA-256 digest: *([0-9a-fA-F:]+).*/\1/p' <<< "${SIGNERS}" | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          DEBUG_CERT_SHA256="$(keytool -list -v -keystore android/app/debug.keystore \
            -storepass android -alias androiddebugkey 2>/dev/null \
            | sed -nE 's/^[[:space:]]*SHA256: *([0-9a-fA-F:]+).*/\1/p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          if [ -z "${APK_CERT_SHA256}" ]; then
            echo "::error::could not read the signing certificate digest out of apksigner's output"
            exit 1
          fi
          if [ -z "${DEBUG_CERT_SHA256}" ]; then
            echo "::error::could not read android/app/debug.keystore's certificate digest with keytool, so which key signed this APK cannot be established"
            exit 1
          fi
          echo "APK signer cert SHA-256:      ${APK_CERT_SHA256}"
          echo "debug.keystore cert SHA-256:  ${DEBUG_CERT_SHA256}"
          if [ "${APK_CERT_SHA256}" = "${DEBUG_CERT_SHA256}" ]; then
            echo "::warning::Signed with the in-repo debug keystore (android/app/debug.keystore), not a production release key."
            {
              echo "### Signing"
              echo
              echo "This APK is signed with this repository's committed **debug** keystore (androiddebugkey, certificate SHA-256 \`${APK_CERT_SHA256}\`). That is deliberate -- it is what lets consecutive CI builds install as updates over each other -- but it is not a store-grade release signature, and no production key or signing secret is configured for this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::Signed with a certificate that is NOT the committed debug key. If a production key was configured for this dispatch, this is expected; otherwise the APK was signed by something else and that needs explaining before it is published."
          fi
          echo "OK: version and signature verified (versionName=${APK_NAME}, versionCode=${APK_CODE})."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.apk_name }}
          path: ${{ steps.locate.outputs.path }}
          # GeneralsX @bugfix Android CI 18/07/2026 was 30: the free plan's
          # Actions storage quota is 0.5 GB total and each APK is ~110 MB, so
          # a single busy day of testing (this project pushes several builds
          # an hour while chasing device-specific bugs) filled it to 90% on
          # its own even with the "Delete old artifacts" cleanup step below.
          # 7 days is still ample time for a tester to grab a build.
          retention-days: 7

      # Same 7 days as the APK above on purpose: the table is only useful while
      # someone can still be running the build it came from, and the cleanup
      # step below keeps just the newest run per branch anyway. Released builds
      # do not rely on this copy -- their table is attached to the Release.
      - name: Upload symbol table artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-symbols-run${{ github.run_number }}
          path: symbols/
          # GeneralsX @bugfix Android CI 19/09/2026 was 7, copied from the APK
          # above -- but the quota argument there does not apply here: an APK is
          # ~110 MB, this is a gzipped text symbol table of a few MB. Seven days
          # is shorter than the round trip on a tester report, and that is not
          # hypothetical: a crash reported on 19/09/2026 came from a build whose
          # symbol bundle had already expired, so symbolizing it meant searching
          # every historical APK committed under apk/ for one whose symbol table
          # agreed with the log. Keep these for the full 90 days.
          retention-days: 90

      # GeneralsX @feature Android port 09/07/2026 Actions artifacts expire
      # (30 days) and require a GitHub login to download -- not a real "here,
      # everyone download this" link. Manual dispatch with create_release=true
      # publishes an actual GitHub Release with the APK attached instead,
      # tagged from version_name (set alongside it above) so the release name
      # always matches what's baked into the APK's own versionName.
      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release }}
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.version_name }}" ]; then
            echo "::error::create_release requires version_name to be set (used as the release tag)."
            exit 1
          fi

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: v${{ inputs.version_name }}
          # GeneralsX @bugfix Android CI 15/10/2026 Say which key signed this build on the
          # release page itself, not only in the run log: the published APK is debug-signed (see
          # "Verify APK version and signature"), and a reader of the release must not be left
          # thinking it is store-grade signed.
          body: |
            ${{ inputs.release_notes }}

            ---
            **Signing:** this APK is signed with this repository's debug keystore (`androiddebugkey`), not a production release key.
          files: |
            ${{ steps.locate.outputs.path }}
            symbols/libmain-run${{ github.run_number }}.symbols.txt.gz
          generate_release_notes: true
          make_latest: true

      - name: Collect dependency build logs for diagnosis
        if: always()
        run: |
          mkdir -p logs
          # vcpkg writes the real failure details one level below the summary
          # that lands in configure_android.log — pull them into the artifact.
          cp build/${{ env.PRESET }}/vcpkg-manifest-install.log logs/ 2>/dev/null || true
          if [ -d /opt/vcpkg/buildtrees ]; then
            find /opt/vcpkg/buildtrees -maxdepth 2 -name "*.log" -newer .git -exec cp {} logs/ \; 2>/dev/null || true
          fi
          # DXVK meson configure log, when that stage was reached
          cp build/${{ env.PRESET }}/_deps/dxvk-build-android/meson-logs/meson-log.txt logs/dxvk-meson-log.txt 2>/dev/null || true
          ls -la logs/ || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

      # GeneralsX @feature Android CI 18/07/2026 Actions storage is a shared
      # 0.5 GB account-wide quota (free plan), not per-repo or per-branch --
      # a day of iterating on device-specific bugs (several APK builds/hour,
      # ~110 MB each) fills it well before the retention-days above ever
      # kick in on their own. First pass scoped cleanup only to same-branch
      # artifacts and left main/other branches' old builds untouched, which
      # turned out to be most of the remaining quota (main alone had ~30
      # same-day runs with live artifacts). Sweep the WHOLE repository now:
      # for every branch this workflow has ever run on, keep only its most
      # recent run's artifacts and delete every other run's, regardless of
      # which branch triggered the current run. gh/GITHUB_TOKEN are
      # preinstalled/preauthenticated on every GitHub-hosted runner;
      # `actions: write` above is what authorizes the delete call itself.
      # Best-effort throughout: a delete failing (already expired, already
      # deleted by a concurrent run) must not fail the build.
      - name: Delete superseded artifacts across all branches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          declare -A latest_run

          while IFS=$'\t' read -r branch run_id; do
            [ -z "${branch}" ] && continue
            if [ -z "${latest_run[$branch]:-}" ] || [ "${run_id}" -gt "${latest_run[$branch]}" ]; then
              latest_run[$branch]="${run_id}"
            fi
          done < <(gh api "repos/${{ github.repository }}/actions/artifacts" --paginate \
            --jq '.artifacts[] | [(.workflow_run.head_branch // ""), .workflow_run.id] | @tsv')

          gh api "repos/${{ github.repository }}/actions/artifacts" --paginate \
            --jq '.artifacts[] | [(.workflow_run.head_branch // ""), .workflow_run.id, .id] | @tsv' \
          | while IFS=$'\t' read -r branch run_id artifact_id; do
              [ -z "${branch}" ] && continue
              if [ "${run_id}" != "${latest_run[$branch]:-}" ]; then
                echo "Deleting old artifact ${artifact_id} (branch ${branch}, run ${run_id}, latest for that branch is ${latest_run[$branch]})"
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${artifact_id}" || true
              fi
            done

      # Save caches even when the job failed (see the restore steps above for
      # why plain actions/cache can't do this). Guard each save so a run that
      # restored an exact-key hit doesn't fail trying to re-save it.
      - name: Save Android SDK cache
        if: always() && steps.cache-android-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ env.CMDLINE_TOOLS_VERSION }}-ndk${{ env.NDK_VERSION }}-p35-bt35

      - name: Save vcpkg cache
        if: always() && steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            /opt/vcpkg
            ~/.cache/vcpkg
          key: vcpkg-android-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/triplets/arm64-android.cmake') }}

      - name: Save DXVK build cache
        if: always() && steps.cache-dxvk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build/${{ env.PRESET }}/_deps/dxvk-build-android
          # github.repository is part of the key (not just DXVK_REF/patch hashes):
          # meson's cached _deps/dxvk-build-android bakes the absolute checkout
          # path (/home/runner/work/<repo>/<repo>/...) into its private build
          # state via --reconfigure. Run #22 restored a cache built under this
          # repo's old name (Generals-Mac-iOS-iPad) and meson died with
          # FileNotFoundError on the now-nonexistent cross-file path -- neither
          # DXVK_REF nor the hashed files changed across the rename, so the
          # stale cache kept being "valid" and kept breaking every run.
          # Tying the key to the repo name means a future rename invalidates
          # this cache instead of silently corrupting it again.
          key: dxvk-android-${{ runner.os }}-${{ github.repository }}-${{ env.DXVK_REF }}-${{ hashFiles('Patches/dxvk-android.patch', 'Patches/dxvk-ios.patch', 'cmake/dx8.cmake', 'cmake/meson-arm64-android-cross.ini.in') }}

      # Always re-save under this run's unique key (the restore-keys prefix
      # match above means later runs pick up the freshest available cache);
      # actions/cache never overwrites an existing exact key, and github.run_id
      # is unique per run, so this never no-ops into a skipped save.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ env.PRESET }}-${{ github.run_id }}-stage5-package
